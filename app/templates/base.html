<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Comment Insight{% endblock %}</title>
  <style>
    :root {
      --border: #e2e5eb;
      --border-strong: #cbd1db;
      --muted: #6b7280;
      --muted-light: #9aa1ac;
      --bg: #f4f5f8;
      --surface: #ffffff;
      --surface-muted: #f8f9fc;
      --text: #1a1d29;
      --accent: #2955a3;
      --accent-strong: #1d3f7a;
      --accent-bg: #eaf1fb;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
      --shadow-md: 0 2px 10px rgba(16, 24, 40, 0.08);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.75rem;
      box-shadow: var(--shadow-sm);
    }
    header a {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
    }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(155deg, var(--accent), var(--accent-strong));
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 2rem 1.75rem 3rem;
    }
    h1 { font-size: 1.45rem; margin: 0 0 0.3rem; letter-spacing: -0.01em; }
    h2 { font-size: 1.05rem; margin: 1.75rem 0 0.6rem; color: var(--text); }
    a { color: var(--accent); }

    /* Simple tables (document list) */
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    th, td {
      text-align: left;
      padding: 0.7rem 0.9rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      font-size: 0.92rem;
    }
    th {
      background: var(--surface-muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface-muted); }

    /* Comment cards */
    .comment-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      margin-bottom: 0.85rem;
      overflow: hidden;
    }
    .comment-card-header {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1.2fr 1.2fr;
      gap: 1rem;
      padding: 0.85rem 1.1rem;
      background: var(--surface-muted);
      border-bottom: 1px solid var(--border);
    }
    .field-label {
      display: block;
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted-light);
      margin-bottom: 0.2rem;
    }
    .comment-author { font-weight: 600; font-size: 0.95rem; }
    .comment-card-body {
      padding: 1rem 1.1rem;
    }
    .comment-text {
      margin: 0.35rem 0 0;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .comment-card-context {
      padding: 0.8rem 1.1rem;
      background: var(--surface-muted);
      border-top: 1px solid var(--border);
    }
    .anchor-block {
      margin: 0.3rem 0 0.3rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .paragraph-context {
      margin: 0;
      font-size: 0.83rem;
      line-height: 1.5;
    }

    .muted { color: var(--muted); font-size: 0.85rem; }
    .section-tag {
      display: inline-block;
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid #cfe0fb;
      border-radius: 4px;
      padding: 0.12rem 0.45rem;
      font-size: 0.76rem;
      font-weight: 500;
    }
    .anchor-text {
      background: #fff2c9;
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
      font-weight: 500;
    }
    .reply-tag {
      display: inline-block;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .category-tag {
      display: inline-block;
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.76rem;
      font-weight: 600;
      white-space: nowrap;
      background: var(--surface-muted);
      color: #444;
      border: 1px solid var(--border);
    }
    .cat-editorial { background: #eaf2fe; color: #1d4fa3; border-color: #cfe0fb; }
    .cat-scientific-content { background: #f3ecfd; color: #6b3fb0; border-color: #e2d3fa; }
    .cat-clarification-needed { background: #fff4de; color: #8a5a10; border-color: #ffe4ad; }
    .cat-decision-required { background: #fdeaea; color: #a13333; border-color: #f8caca; }
    .cat-other { background: #eef0f3; color: #51555c; border-color: #dfe2e6; }
    .rationale {
      font-size: 0.8rem;
      font-style: italic;
      color: var(--muted);
      margin: 0.5rem 0 0;
    }

    form.filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      align-items: end;
      margin-bottom: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      box-shadow: var(--shadow-sm);
    }
    form.filters label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted-light);
      margin-bottom: 0.3rem;
    }
    input[type=text], select, input[type=file] {
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 0.9rem;
      background: var(--surface);
      color: var(--text);
    }
    input[type=text]:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(41, 85, 163, 0.15);
    }
    button {
      padding: 0.5rem 1rem;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    button:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    a.button-link {
      display: inline-block;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      background: var(--surface);
    }
    a.button-link:hover { background: var(--surface-muted); }
    .error {
      background: #fdecea;
      border: 1px solid #f3b6ae;
      color: #8a2c22;
      padding: 0.7rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .empty-state {
      color: var(--muted);
      padding: 2rem;
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
    }

    @media (max-width: 720px) {
      .comment-card-header { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header><a href="/"><span class="logo-mark">CI</span>Comment Insight</a></header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
